<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>entity_001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#000;
  --ink-dim:#7fa38b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --ink-dim:#7fa38b; } }
:root[data-theme="dark"]{ --bg:#000; --ink-dim:#7fa38b; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink-dim);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; width:100%; height:100%; touch-action:none; outline:none; cursor:crosshair; image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:pixelated; }
#stage canvas:focus-visible{ outline:1px solid var(--ink-dim); outline-offset:-8px; }
.hint{
  position:fixed; left:0; right:0; bottom:calc(2rem + env(safe-area-inset-bottom,0px)); text-align:center;
  font-size:.95rem; opacity:0; transition:opacity 1.8s ease; pointer-events:none;
}
.hint.on{ opacity:1; }
.hint.gone{ opacity:0; transition-duration:.8s; }
#fail{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:2rem; text-align:center; color:var(--ink-dim); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint" id="hint">Press and hold</div>
<div id="fail">This piece needs WebGL, which this browser isn’t offering.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var hintEl = document.getElementById('hint');
  function fail(){ document.getElementById('fail').style.display='flex'; hintEl.style.display='none'; }
  if(!window.THREE){ fail(); return; }

  var renderer;
  try{ renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'}); }
  catch(e){ fail(); return; }
  // retro dial: render at roughly this many pixels wide, then upscale with hard edges
  var TARGET_W = 720;
  function resScale(){ return Math.min(1, TARGET_W/innerWidth); }
  var DPR = resScale();
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);
  stage.appendChild(renderer.domElement);
  var cv = renderer.domElement;
  cv.tabIndex = 0;
  cv.setAttribute('role','img');
  cv.setAttribute('aria-label','A liquid chrome form floating in darkness, slowly morphing, with green and amber light crawling across its surface. Press and hold, or hold the space bar, to charge it, then release to send a shockwave through it.');
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var useComposer = !!(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass && THREE.ShaderPass);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 60);

  function clamp01(x){ return Math.min(1, Math.max(0, x)); }
  function sstep(a,b,x){ var t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); }
  function ease(t){ t = clamp01(t); return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

  /* ---------- the form ---------- */
  var NOISE = [
    'vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }',
    'vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }',
    'vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }',
    'vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }',
    'float snoise(vec3 v){',
    ' const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0,0.5,1.0,2.0);',
    ' vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);',
    ' vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;',
    ' vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);',
    ' vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;',
    ' i = mod289(i);',
    ' vec4 p = permute(permute(permute(i.z + vec4(0.0,i1.z,i2.z,1.0)) + i.y + vec4(0.0,i1.y,i2.y,1.0)) + i.x + vec4(0.0,i1.x,i2.x,1.0));',
    ' float n_ = 0.142857142857; vec3 ns = n_*D.wyz - D.xzx;',
    ' vec4 j = p - 49.0*floor(p*ns.z*ns.z);',
    ' vec4 x_ = floor(j*ns.z); vec4 y_ = floor(j - 7.0*x_);',
    ' vec4 x = x_*ns.x + ns.yyyy; vec4 y = y_*ns.x + ns.yyyy;',
    ' vec4 h = 1.0 - abs(x) - abs(y);',
    ' vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);',
    ' vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;',
    ' vec4 sh = -step(h, vec4(0.0));',
    ' vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;',
    ' vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);',
    ' vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
    ' p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;',
    ' vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);',
    ' m = m*m;',
    ' return 42.0*dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
    '}'
  ].join('\n');

  var VERT = [
    'uniform float uTime; uniform float uPull; uniform float uCharge; uniform float uWaveT; uniform float uWaveAmp;',
    'uniform vec3 uMag; uniform vec3 uWaveO;',
    'attribute vec3 aB;',
    'varying vec3 vWN; varying vec3 vWP; varying float vD; varying vec3 vB;',
    NOISE,
    'float disp(vec3 p){',
    ' float t = uTime;',
    ' float n = snoise(p*0.85 + vec3(0.0,0.0,t*0.07))*0.55',
    '         + snoise(p*1.7 + vec3(t*0.09,0.0,0.0) + 7.0)*0.26',
    '         + snoise(p*3.4 - vec3(0.0,t*0.13,0.0) + 19.0)*0.07;',
    ' float rd = 1.0 - abs(snoise(p*1.9 + vec3(0.0,t*0.06,3.0)));',
    ' n += 0.12*(rd*rd - 0.35);',
    ' n += uCharge*0.06*snoise(p*7.0 + vec3(0.0,t*4.0,0.0));',
    ' float d = n*0.42;',
    ' float m = max(dot(p,uMag), 0.0);',
    ' d += uPull*(0.16*pow(m,3.0) + 0.34*pow(m,14.0));',
    ' float ang = acos(clamp(dot(p,uWaveO), -1.0, 1.0));',
    ' float q = ang - uWaveT*2.6;',
    ' d += uWaveAmp*sin(q*11.0)*exp(-abs(q)*3.2)*exp(-uWaveT*0.9);',
    ' return d;',
    '}',
    'void main(){',
    ' vec3 p = normalize(position);',
    ' vec3 up = abs(p.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);',
    ' vec3 t1 = normalize(cross(p, up)); vec3 t2 = cross(p, t1);',
    ' float e = 0.015;',
    ' vec3 pa = normalize(p + t1*e); vec3 pb = normalize(p + t2*e);',
    ' float d0 = disp(p); float d1 = disp(pa); float d2 = disp(pb);',
    ' float R = 1.15;',
    ' vec3 P0 = p*(R+d0); vec3 P1 = pa*(R+d1); vec3 P2 = pb*(R+d2);',
    ' vec3 n = normalize(cross(P1-P0, P2-P0)); if(dot(n,p) < 0.0) n = -n;',
    ' vD = d0; vWN = n; vWP = P0; vB = aB;',
    ' gl_Position = projectionMatrix*viewMatrix*vec4(P0,1.0);',
    '}'
  ].join('\n');

  var FRAG = [
    'uniform float uTime; uniform float uCharge; uniform float uScan; uniform float uWireAmt; uniform vec2 uTilt; uniform vec3 uMag;',
    'varying vec3 vWN; varying vec3 vWP; varying float vD; varying vec3 vB;',
    'mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }',
    'vec3 env(vec3 r, float hot){',
    ' r.xz = rot(uTime*0.05 + uTilt.x*1.2)*r.xz;',
    ' r.yz = rot(uTilt.y*0.8)*r.yz;',
    ' float az = atan(r.z, r.x);',
    ' vec3 grn = vec3(0.0,1.0,0.3); vec3 mint = vec3(0.8,1.0,0.88); vec3 amb = vec3(1.0,0.42,0.04); vec3 hotc = vec3(1.0,0.3,0.02);',
    ' vec3 col = mix(vec3(0.0), vec3(0.0,0.035,0.01), smoothstep(-0.6,1.0,r.y));',
    ' float l1 = pow(0.5+0.5*sin(az*7.0 + r.y*4.0 - uTime*0.55), 36.0);',
    ' float l2 = pow(0.5+0.5*sin(az*3.0 - r.y*6.0 + uTime*0.35 + 1.7), 60.0);',
    ' float l3 = pow(0.5+0.5*sin(r.y*14.0 + az + uTime*0.25), 90.0);',
    ' col += grn*l1*3.0 + mint*l2*3.5 + mix(grn, hotc, hot)*l3*2.6;',
    ' vec3 sb = normalize(vec3(0.6,0.7,-0.4)); sb.xz = rot(-uTime*0.08)*sb.xz;',
    ' col += mint*pow(max(dot(r,sb),0.0), 60.0)*3.0;',
    ' vec3 sl = normalize(vec3(-0.8,0.1,0.5)); sl.xz = rot(uTime*0.06)*sl.xz;',
    ' col += amb*pow(max(dot(r,sl),0.0), 90.0)*(1.1 + 2.2*hot);',
    ' col += vec3(0.0,0.2,0.06)*pow(max(-r.y,0.0), 3.0)*0.7;',
    ' return col;',
    '}',
    'void main(){',
    ' vec3 v = normalize(cameraPosition - vWP);',
    ' vec3 nf = normalize(cross(dFdx(vWP), dFdy(vWP)));',
    ' if(dot(nf, v) < 0.0) nf = -nf;',
    ' vec3 n = normalize(mix(normalize(vWN), nf, 0.45));',
    ' float wm = min(min(vB.x, vB.y), vB.z);',
    ' float fw = fwidth(wm);',
    ' float wire = 1.0 - smoothstep(fw*0.5, fw*1.5, wm);',
    ' float front = gl_FrontFacing ? 1.0 : 0.0;',
    ' float solidM = smoothstep(uScan - 0.05, uScan + 0.05, vWP.y)*front;',
    ' float wireOnly = 1.0 - solidM;',
    ' float wireA = wire*uWireAmt*(0.5 + 0.5*front);',
    ' if(wireOnly > 0.5 && wireA < 0.04) discard;',
    ' vec3 r = reflect(-v, n);',
    ' float nv = max(dot(n,v), 0.0);',
    ' float fres = pow(1.0 - nv, 3.0);',
    ' float hot = uCharge*pow(max(dot(n,uMag),0.0), 4.0);',
    ' vec3 c = env(r, hot);',
    ' c *= vec3(0.8,0.95,0.84);',
    ' c = c*(0.5 + 0.9*fres) + vec3(0.0,0.45,0.12)*fres*0.8;',
    ' float w = abs(fract(vD*9.0 + uTime*0.03) - 0.5);',
    ' float vein = 1.0 - smoothstep(0.0, 0.03, w);',
    ' c += mix(vec3(0.0,1.0,0.35), vec3(1.0,0.38,0.02), hot)*vein*(0.1 + 1.8*uCharge*(0.3+hot));',
    ' c += vec3(1.0,0.3,0.02)*hot*0.4;',
    ' vec3 wc = vec3(0.1,1.0,0.4)*(1.3 + 0.7*sin(vWP.y*6.0 - uTime*2.0));',
    ' vec3 col = c*solidM + wc*wireA*wireOnly;',
    ' float q = (vWP.y - uScan)*10.0;',
    ' float band = exp(-q*q)*step(-2.6, uScan)*step(uScan, 2.6);',
    ' col += vec3(0.75,1.0,0.85)*band*1.8*(0.5 + 0.5*front);',
    ' gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var mat = new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG, side: THREE.DoubleSide,
    extensions: { derivatives: true },
    uniforms:{
      uTime:{value:0}, uPull:{value:0}, uCharge:{value:0}, uWaveT:{value:9}, uWaveAmp:{value:0},
      uMag:{value:new THREE.Vector3(0,0,1)}, uWaveO:{value:new THREE.Vector3(0,-1,0)},
      uScan:{value:3.0}, uWireAmt:{value:0}, uTilt:{value:new THREE.Vector2(0,0)}
    }
  });
  var geo = new THREE.IcosahedronGeometry(1, 12);
  var cnt = geo.attributes.position.count, bary = new Float32Array(cnt*3);
  for(var bi=0; bi<cnt; bi+=3){
    bary[bi*3]=1; bary[bi*3+1]=0; bary[bi*3+2]=0;
    bary[bi*3+3]=0; bary[bi*3+4]=1; bary[bi*3+5]=0;
    bary[bi*3+6]=0; bary[bi*3+7]=0; bary[bi*3+8]=1;
  }
  geo.setAttribute('aB', new THREE.BufferAttribute(bary, 3));
  var mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  var U = mat.uniforms;

  /* ---------- post ---------- */
  var composer, bloom, finalPass;
  if(!useComposer){
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputEncoding = THREE.sRGBEncoding;
  } else {
    var rt = new THREE.WebGLRenderTarget(innerWidth*DPR, innerHeight*DPR, {type:THREE.HalfFloatType, format:THREE.RGBAFormat, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter});
    composer = new THREE.EffectComposer(renderer, rt);
    if(composer.setPixelRatio) composer.setPixelRatio(DPR);
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.8, 0.7);
    composer.addPass(bloom);
    finalPass = new THREE.ShaderPass({
      uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uGlow:{value:0}, uCharge:{value:0}, uAspect:{value:innerWidth/innerHeight}, uExp:{value:1.15} },
      vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:[
        'uniform sampler2D tDiffuse; uniform float uTime; uniform float uGlow; uniform float uCharge; uniform float uAspect; uniform float uExp; varying vec2 vUv;',
        'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }',
        'float b2(vec2 p){ vec2 q = mod(floor(p), 2.0); return q.x*2.0 + q.y*3.0 - q.x*q.y*4.0; }',
        'float b4(vec2 p){ return (4.0*b2(p) + b2(p*0.5))/16.0; }',
        'void main(){',
        ' vec2 cc = vUv - 0.5; vec2 p = cc; p.x *= uAspect; float r = length(p);',
        ' vec2 off = cc*0.005*length(cc);',
        ' vec3 c = vec3(texture2D(tDiffuse, vUv+off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv-off).b);',
        ' float g = smoothstep(0.95, 0.0, r);',
        ' c += mix(vec3(0.0,0.045,0.014), vec3(0.2,0.05,0.0), uCharge)*g*g*uGlow;',
        ' c = vec3(1.0) - exp(-c*uExp);',
        ' c = pow(c, vec3(1.0/2.2));',
        ' float vig = smoothstep(1.0, 0.25, r*1.35);',
        ' c *= mix(0.25, 1.0, vig);',
        ' float L = 36.0;',
        ' c = floor(c*L + b4(gl_FragCoord.xy))/L;',
        ' c += (hash(vUv*1000.0 + uTime) - 0.5)*0.015;',
        ' gl_FragColor = vec4(c, 1.0); }'
      ].join('\n')
    });
    finalPass.renderToScreen = true;
    composer.addPass(finalPass);
  }

  function frameDist(){
    var a = innerWidth/innerHeight, tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    return Math.max(5.4, 1.7/(tanH*Math.min(a, 1.6)));
  }
  var camDist = frameDist();
  addEventListener('resize', function(){
    DPR = resScale(); renderer.setPixelRatio(DPR);
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    if(composer){ if(composer.setPixelRatio) composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight); finalPass.uniforms.uAspect.value = innerWidth/innerHeight; }
    camDist = frameDist();
  });

  /* ---------- interaction ---------- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), closest = new THREE.Vector3(), magT = new THREE.Vector3(0,0,1);
  var px = innerWidth/2, py = innerHeight/2, hover = false, ptype = 'mouse';
  var down = false, charge = 0, pull = 0, flash = 0, waveT = 9, used = false, keyDown = false;
  var tilt = new THREE.Vector2(), tiltT = new THREE.Vector2(), gyro = false;

  // timeline: a short black beat, the wireframe wakes, a scan plane turns it into chrome
  var T_WIRE = 0.5, T_SCAN0 = 1.5, T_DONE = 4.3;
  var t0 = performance.now(), introDone = false, hintShown = false;
  if(reduce) t0 = performance.now() - 6000;

  function skip(){ var t = (performance.now()-t0)/1000; if(t < T_DONE) t0 = performance.now() - (T_DONE + 0.2)*1000; }
  function useIt(){ if(!used){ used = true; hintEl.classList.add('gone'); } }
  function press(){ if(!introDone){ skip(); return; } if(!down){ down = true; useIt(); } }
  function release(){
    if(!down) return;
    down = false;
    U.uWaveO.value.copy(U.uMag.value); U.uWaveAmp.value = 0.1 + 0.42*charge; waveT = 0; flash = 0.35 + charge;
  }
  cv.addEventListener('pointerdown', function(e){
    ptype = e.pointerType; px = e.clientX; py = e.clientY; hover = true;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    askGyro(); press();
  });
  cv.addEventListener('pointermove', function(e){ ptype = e.pointerType; px = e.clientX; py = e.clientY; hover = true; });
  cv.addEventListener('pointerleave', function(){ if(ptype==='mouse') hover = false; });
  ['pointerup','pointercancel'].forEach(function(n){ cv.addEventListener(n, function(){ release(); if(ptype!=='mouse') hover = false; }); });
  cv.addEventListener('keydown', function(e){
    if(!introDone){ skip(); return; }
    if((e.key === ' ' || e.key === 'Enter') && !keyDown){ keyDown = true; e.preventDefault(); hover = false; ptype = 'key'; press(); }
  });
  cv.addEventListener('keyup', function(e){ if(e.key === ' ' || e.key === 'Enter'){ keyDown = false; release(); } });

  function onOrient(e){
    if(e.gamma == null || e.beta == null) return;
    gyro = true;
    tiltT.set(Math.max(-1, Math.min(1, e.gamma/35)), Math.max(-1, Math.min(1, (e.beta-45)/35)));
  }
  var gyroAsked = false;
  function askGyro(){
    if(gyroAsked) return; gyroAsked = true;
    try{
      if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
        DeviceOrientationEvent.requestPermission().then(function(s){ if(s === 'granted') addEventListener('deviceorientation', onOrient); }).catch(function(){});
      }
    }catch(_){}
  }
  try{ if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') addEventListener('deviceorientation', onOrient); }catch(_){}

  function aimAtPointer(){
    ndc.set(px/innerWidth*2 - 1, -(py/innerHeight*2 - 1));
    ray.setFromCamera(ndc, camera);
    var o = ray.ray.origin, d = ray.ray.direction;
    var t = -o.dot(d);
    closest.copy(o).addScaledVector(d, t);
    var R = 1.35, l = closest.length();
    if(l < R){ var tt = t - Math.sqrt(R*R - l*l); magT.copy(o).addScaledVector(d, tt).normalize(); }
    else magT.copy(closest).normalize();
  }

  /* ---------- frame ---------- */
  var last = t0;
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now-last)/1000); last = now;
    var t = (now - t0)/1000;

    // the build: wire first, then a plane sweeps down and everything it passes becomes metal
    U.uWireAmt.value = sstep(T_WIRE, T_WIRE + 1.0, t);
    var scan;
    if(t < T_SCAN0) scan = 3.0;
    else if(t < T_DONE) scan = 2.1 - 4.2*ease((t-T_SCAN0)/(T_DONE-T_SCAN0));
    else scan = -3.0;
    U.uScan.value = scan;

    if(!introDone && t >= T_DONE){
      introDone = true;
      U.uWaveO.value.set(0,-1,0); U.uWaveAmp.value = 0.2; waveT = 0; flash = 1.0;
    }
    if(!hintShown && t > T_DONE + 1.4){ hintShown = true; if(!used) hintEl.classList.add('on'); }

    if(down) charge = Math.min(1, charge + dt/1.6); else charge = Math.max(0, charge - dt*2.4);
    var tp = 0;
    if(down) tp = 0.5 + 0.5*charge; else if(hover && ptype === 'mouse') tp = 0.28;
    pull += (tp - pull)*Math.min(1, dt*5);
    waveT += dt; if(waveT > 7) U.uWaveAmp.value = 0;
    flash *= Math.exp(-dt*2.6);

    if(!gyro){ tiltT.set((px/innerWidth-0.5)*0.9, -(py/innerHeight-0.5)*0.7); }
    tilt.lerp(tiltT, Math.min(1, dt*2.2));
    var pushIn = reduce ? 1 : ease((t-0.3)/4.2);
    var dist = camDist*(1 + 0.18*(1-pushIn));
    camera.position.set(tilt.x*0.6, -tilt.y*0.35, dist);
    camera.lookAt(0,0,0);
    camera.updateMatrixWorld();
    aimAtPointer();
    U.uMag.value.lerp(magT, Math.min(1, dt*8)).normalize();

    U.uTime.value = t*(reduce ? 0.3 : 1);
    U.uPull.value = pull; U.uCharge.value = charge; U.uWaveT.value = waveT;
    U.uTilt.value.copy(tilt);

    if(useComposer){
      bloom.strength = 0.9 + flash*1.2 + charge*0.4;
      finalPass.uniforms.uTime.value = t % 100;
      finalPass.uniforms.uCharge.value = charge;
      finalPass.uniforms.uGlow.value = sstep(0.6, 2.5, t);
      composer.render(dt);
    } else renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
