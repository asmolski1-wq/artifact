<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Witam, witam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#000;
  --ink-dim:#6f8f7a;
  --phos:#39ff7a;
  --blood:#ff2a1e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --ink-dim:#6f8f7a; --phos:#39ff7a; --blood:#ff2a1e; } }
:root[data-theme="dark"]{ --bg:#000; --ink-dim:#6f8f7a; --phos:#39ff7a; --blood:#ff2a1e; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--ink-dim);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; width:100%; height:100%; touch-action:none; outline:none; cursor:crosshair; image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:pixelated; }
#stage canvas:focus-visible{ outline:1px solid var(--ink-dim); outline-offset:-8px; }
.hint{
  position:fixed; left:0; right:0; bottom:calc(2rem + env(safe-area-inset-bottom,0px)); text-align:center;
  font-size:.95rem; opacity:0; transition:opacity 1.6s ease; pointer-events:none; z-index:3; padding:0 1.5rem;
}
.hint.on{ opacity:.6; }
.joy{
  position:fixed; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%;
  border:1px solid rgba(57,255,122,.3); opacity:0; pointer-events:none; z-index:3; transition:opacity .25s ease;
}
.joy.on{ opacity:1; }
.joy i{ position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(57,255,122,.14); border:1px solid rgba(57,255,122,.5); }
.ring{
  position:fixed; right:calc(1.6rem + env(safe-area-inset-right,0px)); bottom:calc(2.2rem + env(safe-area-inset-bottom,0px));
  width:78px; height:78px; border-radius:50%; border:1.5px solid rgba(57,255,122,.55);
  box-shadow:0 0 14px rgba(57,255,122,.2), inset 0 0 14px rgba(57,255,122,.1);
  opacity:0; pointer-events:none; z-index:4; transition:opacity .8s ease, transform .15s ease; touch-action:none;
}
.ring::after{ content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:rgba(57,255,122,.7); }
.ring.on{ opacity:.85; pointer-events:auto; }
.ring.hold{ transform:scale(.92); border-color:rgba(255,42,30,.95); box-shadow:0 0 22px rgba(255,42,30,.5), inset 0 0 18px rgba(255,42,30,.3); }
.ring.hold::after{ background:rgba(255,42,30,.95); }
@keyframes ringcue{ 0%,100%{ box-shadow:0 0 14px rgba(57,255,122,.2), inset 0 0 14px rgba(57,255,122,.1); } 50%{ box-shadow:0 0 28px rgba(57,255,122,.65), inset 0 0 20px rgba(57,255,122,.3); } }
.ring.cue:not(.hold){ animation:ringcue 2.6s ease-in-out infinite; }
.keys{ position:fixed; left:0; right:0; bottom:calc(1.7rem + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; align-items:flex-end; gap:34px; pointer-events:none; z-index:3; }
.cue{ opacity:0; transition:opacity 1.6s ease; }
.cue.on{ opacity:.7; }
.kg{ display:flex; align-items:flex-end; }
.kw{ display:grid; grid-template-columns:repeat(3,30px); gap:4px; }
.kw i{ display:block; }
.keys b{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; box-sizing:border-box; border:1px solid rgba(111,143,122,.55); border-radius:5px; font:500 12px "Instrument Sans", system-ui, sans-serif; color:#6f8f7a; background:rgba(0,0,0,.25); transition:background .12s ease, border-color .12s ease, color .12s ease, box-shadow .12s ease; }
.keys b.kb{ width:128px; height:28px; }
.keys b.dn{ background:rgba(57,255,122,.18); border-color:#39ff7a; color:#bfffd5; box-shadow:0 0 12px rgba(57,255,122,.35); }
.keys b.kb.dn{ background:rgba(255,42,30,.2); border-color:#ff2a1e; box-shadow:0 0 14px rgba(255,42,30,.4); }
.mouse{ color:#6f8f7a; animation:mseek 3s ease-in-out infinite; }
@keyframes mseek{ 0%,100%{ transform:translateX(-4px) rotate(-4deg); } 50%{ transform:translateX(4px) rotate(4deg); } }
.mbtn{ fill:#39ff7a; fill-opacity:.3; animation:mpulse 2.4s ease-in-out infinite; }
.mbtn.dn{ fill:#ff2a1e; fill-opacity:.9; animation:none; }
@keyframes mpulse{ 0%,100%{ fill-opacity:.2; } 50%{ fill-opacity:.95; } }
.gjoy{ position:fixed; left:calc(2.2rem + env(safe-area-inset-left,0px)); bottom:calc(5.5rem + env(safe-area-inset-bottom,0px)); width:110px; height:110px; border-radius:50%; border:1px solid rgba(57,255,122,.3); pointer-events:none; z-index:3; }
.gjoy i{ position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:rgba(57,255,122,.14); border:1px solid rgba(57,255,122,.5); animation:gj 3.2s ease-in-out infinite; }
@keyframes gj{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(0,-28px); } 50%{ transform:translate(18px,-18px); } 75%{ transform:translate(-14px,-24px); } }
.glook{ position:fixed; right:calc(1.6rem + env(safe-area-inset-right,0px)); bottom:calc(8.4rem + env(safe-area-inset-bottom,0px)); width:92px; height:34px; border-radius:17px; border:1px solid rgba(57,255,122,.28); pointer-events:none; z-index:3; }
.glook i{ position:absolute; top:50%; left:7px; width:18px; height:18px; margin-top:-9px; border-radius:50%; background:rgba(57,255,122,.25); border:1px solid rgba(57,255,122,.5); animation:gl 2.8s ease-in-out infinite; }
@keyframes gl{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(56px); } }
#fail{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:2rem; text-align:center; color:var(--ink-dim); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div class="ring" id="ring"></div>
<div class="hint" id="hint"></div>
<div class="keys" id="keys">
  <div class="kg cue" id="gLook"><svg class="mouse" viewBox="0 0 24 36" width="24" height="36"><rect x="2" y="2" width="20" height="32" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="2" x2="12" y2="14" stroke="currentColor" stroke-width="1.5"/><path id="mBtn" class="mbtn" d="M12 2 A10 10 0 0 0 2 12 V14 H12 Z"/></svg></div>
  <div class="kg cue" id="gMove"><div class="kw"><i></i><b id="kW">W</b><i></i><b id="kA">A</b><b id="kS">S</b><b id="kD">D</b></div></div>
  
</div>
<div class="gjoy cue" id="gJoy"><i></i></div>
<div class="glook cue" id="gLk"><i></i></div>
<div id="fail">This piece needs WebGL, which this browser isn’t offering.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var hintEl = document.getElementById('hint'), joyEl = document.getElementById('joy'), knobEl = document.getElementById('knob'), ringEl = document.getElementById('ring');
  var gLookEl = document.getElementById('gLook'), gMoveEl = document.getElementById('gMove'), gJoyEl = document.getElementById('gJoy'), gLkEl = document.getElementById('gLk');
  var kW = document.getElementById('kW'), kA = document.getElementById('kA'), kS = document.getElementById('kS'), kD = document.getElementById('kD'), mBtn = document.getElementById('mBtn');
  function fail(){ document.getElementById('fail').style.display='flex'; hintEl.style.display='none'; }
  if(!window.THREE){ fail(); return; }

  /* ---------- device profile ---------- */
  var coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var touchMode = coarse;
  var MOBILE = coarse && Math.min(innerWidth, innerHeight) < 900;
  var SHADOWS = !MOBILE;
  var TORCH_LIGHTS = MOBILE ? 2 : 4;
  var qW = MOBILE ? 520 : 960;
  var BLOOM_BASE = MOBILE ? 0.7 : 0.9;
  var NDUST = MOBILE ? 110 : 260;

  /* ---------- room scale ---------- */
  var HALF = 23.5, WALLS = HALF*2, H = 20;

  var renderer;
  try{ renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'}); }
  catch(e){ fail(); return; }
  function resScale(){ return Math.min(1, qW/innerWidth); }
  var DPR = resScale();
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);
  if(SHADOWS){ renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
  stage.appendChild(renderer.domElement);
  var cv = renderer.domElement;
  cv.tabIndex = 0;
  cv.setAttribute('role','img');
  cv.setAttribute('aria-label','A first-person view of a vast, almost lightless stone hall with a liquid chrome form floating over a stepped platform in the middle and a pale window far away. Walk with WASD or the left thumb, look with the mouse or by dragging, and hold the left mouse button or the ring to charge the form and release to send a shockwave.');
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var useComposer = !!(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass && THREE.ShaderPass);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x010302, 0.043);
  var camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 90);
  camera.rotation.order = 'YXZ';
  var baseFov = 62, lastFov = 62;
  function setFov(){ baseFov = (innerWidth/innerHeight < 1) ? 72 : 62; camera.fov = baseFov; lastFov = baseFov; camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  setFov();

  function clamp01(x){ return Math.min(1, Math.max(0, x)); }
  function sstep(a,b,x){ var t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); }
  function ease(t){ t = clamp01(t); return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
  // mostly steady, then rarely and violently dies: rapid stutter, near-black
  function flick(t, s){
    var a = Math.sin(t*13.1 + s)*Math.sin(t*5.3 + s*1.7);
    var base = 0.9 + 0.1*a;
    var dying = Math.sin(t*0.41 + s*3.0)*Math.sin(t*0.23 + s*1.3) > 0.975;
    if(dying) return 0.03 + 0.97*(Math.sin(t*47.0 + s*9.0) > 0.2 ? 1.0 : 0.0)*0.5;
    return base;
  }

  /* =====================================================================
     SHARED WAVE STATE: the shockwave that turns the room into wireframe
     ===================================================================== */
  var WU = {
    uWaveC:{value:new THREE.Vector3(0,3.6,0)},
    uWR:{value:[0,0,0,0,0,0]}, uWA:{value:[0,0,0,0,0,0]}, uWT:{value:[10,10,10,10,10,10]}, uWH:{value:[0,0,0,0,0,0]},
    uWM:{value:[0,0,0,0,0,0]}, uWK:{value:[0,0,0,0,0,0]}, uWS:{value:[15,15,15,15,15,15]}
  };
  var WIRE_FRAG = [
    '{',
    ' float dd = length(vWPos - uWaveC);',
    ' float wm = min(min(vB.x, vB.y), vB.z);',
    ' float fw = fwidth(wm);',
    ' float wire = 1.0 - smoothstep(fw*0.6, fw*1.7, wm);',
    ' vec3 wn = abs(normalize(cross(dFdx(vWPos), dFdy(vWPos))));',
    ' vec2 guv = (wn.y > max(wn.x, wn.z)) ? vWPos.xz : ((wn.x > wn.z) ? vWPos.zy : vWPos.xy);',
    ' vec2 gq = guv/1.6;',
    ' vec2 gw = fwidth(gq);',
    ' vec2 gl = abs(fract(gq - 0.5) - 0.5)/max(gw, vec2(0.0005));',
    ' float grid = 1.0 - min(min(gl.x, gl.y)/1.3, 1.0);',
    ' float dark = 0.0; vec3 wadd = vec3(0.0);',
    ' for(int wi = 0; wi < 6; wi++){',
    '  float wa = uWA[wi];',
    '  if(wa > 0.0005){',
    '   float fr = dd - uWR[wi];',
    '   float ahead = smoothstep(0.9, 0.0, fr);',
    '   float behind = smoothstep(-uWT[wi], -0.4, fr);',
    '   float zone = ahead*behind*wa;',
    '   float md = uWM[wi];',
    '   float pat = mix(wire, grid, md);',
    '   float lead = exp(-fr*fr*1.6)*wa;',
    '   vec3 wc = mix(vec3(0.1,1.0,0.4), vec3(1.0,0.06,0.03), uWH[wi]);',
    '   dark = max(dark, mix(0.8, 0.5, md)*zone);',
    '   wadd += wc*pat*(zone*1.8 + lead*2.2) + wc*lead*mix(0.1, 0.3, md);',
    '  }',
    ' }',
    ' gl_FragColor.rgb = gl_FragColor.rgb*(1.0 - dark) + min(wadd, vec3(3.2));',
    '}'
  ].join('\n');
  var HEAT_FRAG = [
    '{',
    ' float hd = length(vWPos - uWaveC);',
    ' vec3 hadd = vec3(0.0);',
    ' for(int hi = 0; hi < 6; hi++){',
    '  float kq = uWK[hi];',
    '  if(kq > 0.001){',
    '   float dl = uWR[hi] - hd;',
    '   float hk = kq*step(0.0, dl)*exp(-max(dl, 0.0)/(uWS[hi]*1.8))*smoothstep(0.0, 0.6, dl);',
    '   hadd += mix(vec3(1.0,0.1,0.02), vec3(1.0,0.5,0.12), hk)*hk*(1.5 + 1.0*uWH[hi]);',
    '  }',
    ' }',
    ' gl_FragColor.rgb += min(hadd, vec3(3.0));',
    '}'
  ].join('\n');
  function patch(m, heat){
    m.extensions = {derivatives:true};
    m.onBeforeCompile = function(sh){
      for(var k in WU) sh.uniforms[k] = WU[k];
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nattribute vec3 aB; varying vec3 vB; varying vec3 vWPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvB = aB; vWPos = (modelMatrix*vec4(transformed,1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform vec3 uWaveC; uniform float uWR[6]; uniform float uWA[6]; uniform float uWT[6]; uniform float uWH[6]; uniform float uWM[6]; uniform float uWK[6]; uniform float uWS[6];\nvarying vec3 vB; varying vec3 vWPos;')
        .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' + WIRE_FRAG + (heat ? HEAT_FRAG : ''));
    };
    return m;
  }

  /* =====================================================================
     PROCEDURAL TEXTURES
     ===================================================================== */
  function tex(draw){
    var s = 256, c = document.createElement('canvas'); c.width = c.height = s;
    var x = c.getContext('2d'); draw(x, s);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4;
    return t;
  }
  function grain(x, s, amt){
    var id = x.getImageData(0,0,s,s), d = id.data;
    for(var i=0;i<d.length;i+=4){ var n = (Math.random()-0.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    x.putImageData(id,0,0);
  }
  function grime(x, s, n){
    for(var i=0;i<n;i++){
      var gx = Math.random()*s, gy = Math.random()*s, r = 10 + Math.random()*40;
      var g = x.createRadialGradient(gx,gy,0,gx,gy,r);
      g.addColorStop(0,'rgba(4,14,10,'+(0.15+Math.random()*0.2)+')'); g.addColorStop(1,'rgba(4,14,10,0)');
      x.fillStyle = g; x.fillRect(gx-r,gy-r,r*2,r*2);
    }
  }
  function streaks(x, s, n){
    for(var i=0;i<n;i++){
      var sx = Math.random()*s, len = 40 + Math.random()*150;
      x.fillStyle = 'rgba(0,0,0,'+(0.12+Math.random()*0.18)+')'; x.fillRect(sx, Math.random()*s*0.4, 1+Math.random()*3, len);
    }
  }
  var stoneT = tex(function(x,s){
    x.fillStyle = '#101514'; x.fillRect(0,0,s,s);
    var b = s/2;
    for(var i=0;i<2;i++) for(var j=0;j<2;j++){
      var bx = i*b, by = j*b, sh = (Math.random()*9)|0;
      x.fillStyle = 'rgb('+(24+sh)+','+(30+sh)+','+(28+sh)+')'; x.fillRect(bx+3,by+3,b-6,b-6);
      x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(bx+3,by+3,b-6,3); x.fillRect(bx+3,by+3,3,b-6);
      x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(bx+3,by+b-6,b-6,3); x.fillRect(bx+b-6,by+3,3,b-6);
    }
    streaks(x,s,7); grime(x,s,10); grain(x,s,22);
  });
  var metalT = tex(function(x,s){
    x.fillStyle = '#0f1417'; x.fillRect(0,0,s,s);
    x.fillStyle = '#192024'; x.fillRect(4,4,s-8,s-8);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(s/2-1,0,2,s); x.fillRect(0,s/2-1,s,2);
    var pts = [[14,14],[s-14,14],[14,s-14],[s-14,s-14],[s/2+14,14],[s/2-14,s-14],[14,s/2-14],[s-14,s/2+14]];
    pts.forEach(function(p){ x.fillStyle='rgba(255,255,255,.12)'; x.beginPath(); x.arc(p[0],p[1],4,0,6.283); x.fill(); x.fillStyle='rgba(0,0,0,.6)'; x.beginPath(); x.arc(p[0]+1,p[1]+1,2,0,6.283); x.fill(); });
    for(var k=0;k<26;k++){ x.strokeStyle='rgba(255,255,255,'+(0.02+Math.random()*0.04)+')'; x.beginPath(); var sx=Math.random()*s, sy=Math.random()*s; x.moveTo(sx,sy); x.lineTo(sx+(Math.random()-.5)*60, sy+(Math.random()-.5)*8); x.stroke(); }
    streaks(x,s,5); grime(x,s,8); grain(x,s,16);
  });
  var floorT = tex(function(x,s){
    x.fillStyle = '#060908'; x.fillRect(0,0,s,s);
    var b = s/2;
    for(var i=0;i<2;i++) for(var j=0;j<2;j++){
      var sh = (Math.random()*8)|0;
      x.fillStyle = 'rgb('+(14+sh)+','+(18+sh)+','+(17+sh)+')'; x.fillRect(i*b+2,j*b+2,b-4,b-4);
      x.fillStyle='rgba(255,255,255,.04)'; x.fillRect(i*b+2,j*b+2,b-4,2);
    }
    for(var k=0;k<40;k++){ x.fillStyle='rgba(0,0,0,.22)'; x.fillRect(Math.random()*s, Math.random()*s, 2+Math.random()*14, 1+Math.random()*3); }
    grime(x,s,12); grain(x,s,18);
  });

  var matStone = patch(new THREE.MeshStandardMaterial({map:stoneT, roughness:0.95, metalness:0.0, color:0x6e7d75}));
  var matMetal = patch(new THREE.MeshStandardMaterial({map:metalT, roughness:0.88, metalness:0.06, color:0x6a797e}));
  var floorQ = tex(function(x,s){
    x.fillStyle = '#0a0b0a'; x.fillRect(0,0,s,s);
    var b = s/2;
    for(var i=0;i<2;i++) for(var j=0;j<2;j++){
      var bx = i*b, by = j*b, sh = (Math.random()*14)|0;
      x.fillStyle = 'rgb('+(38+sh)+','+(34+sh)+','+(31+sh)+')'; x.fillRect(bx+4,by+4,b-8,b-8);
      x.fillStyle = 'rgba(255,235,210,.10)'; x.fillRect(bx+4,by+4,b-8,4); x.fillRect(bx+4,by+4,4,b-8);
      x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(bx+4,by+b-8,b-8,4); x.fillRect(bx+b-8,by+4,4,b-8);
      x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 2; x.strokeRect(bx+14,by+14,b-28,b-28);
    }
    streaks(x,s,3); grime(x,s,12); grain(x,s,26);
  });
  var matFloor = patch(new THREE.MeshStandardMaterial({map:floorQ, roughness:1.0, metalness:0.0, color:0x78716b}));
  var matDais  = patch(new THREE.MeshStandardMaterial({map:metalT, roughness:0.85, metalness:0.08, color:0x72867d}));
  var matBar   = patch(new THREE.MeshStandardMaterial({map:metalT, roughness:0.88, metalness:0.06, color:0x6a797e}), true);

  /* =====================================================================
     GEOMETRY HELPERS
     ===================================================================== */
  function prep(g){

    });
    var winLv = sstep(3.4, 4.6, ts)*flick(t, 9.1)*(1 + (gutOn ? 2.2*Math.exp(-gutT*2.2) : 0));
    winMat.color.setRGB(0.45*winLv*1.5, 0.72*winLv*1.5, 0.78*winLv*1.5);
    winSpot.intensity = 2.6*winLv;
    shaftMat.uniforms.uLevel.value = winLv;
    amb.intensity = 0.11*artLv + 0.2*Math.min(1, flash)*artLv;

    /* ---- cloth, chains, column flames ---- */
    var decoLv = sstep(1.6, 2.8, ts);
    for(var bj=0; bj<banners.length; bj++){
      var bn = banners[bj], bp = bn.geo.attributes.position, nb = 0;
      for(var wk=0; wk<NW; wk++){
        var ww = waves[wk], bt = ww.t - bn.d/ww.spd;
        if(ww.str > 0.05 && bt > 0){ var bwv = ww.str*Math.exp(-bt*0.9); if(bwv > 0.002){ bwA[nb] = bwv; btA[nb] = bt; nb++; } }
      }
      for(var vi=0; vi<bp.count; vi++){
        var fy = clamp01((3 - bn.oy[vi])/6), badd = 0;
        for(var bq=0; bq<nb; bq++) badd += bwA[bq]*1.15*fy*(0.5 + 0.5*Math.sin(btA[bq]*8.0 - bn.oy[vi]*1.3));
        bp.setZ(vi, bn.oz[vi] + Math.sin(t*0.9 + bn.oy[vi]*0.9 + bn.ph)*0.18*fy + Math.min(badd, 1.9));
      }
      bp.needsUpdate = true;
    }
    for(var cj=0; cj<chains.length; cj++){
      var ch = chains[cj], csw = 0;
      for(var ck=0; ck<NW; ck++){
        var cw = waves[ck], ctc = cw.t - ch.d/cw.spd;
        if(cw.str > 0.05 && ctc > 0) csw += cw.str*0.42*Math.exp(-ctc*0.55)*Math.sin(ctc*3.3);
      }
      csw = Math.max(-0.7, Math.min(0.7, csw));
      ch.group.rotation.z = 0.025*Math.sin(t*0.4 + ch.ph) + ch.ux*csw; ch.group.rotation.x = 0.02*Math.sin(t*0.33 + ch.ph*2.0) - ch.uz*csw;
    }
    for(var hj=0; hj<hang.length; hj++){ var hh = hang[hj], hv = flick(t, hh.ph*2.0 + 11.0)*decoLv*gutFac(hj); hh.mat.color.setRGB(1.0*hv*1.8, 0.05*hv*1.8, 0.02*hv*1.8); hh.mesh.scale.y = 0.7 + 0.5*hv; }
    for(var sj=0; sj<sconces.length; sj++){ var sc = sconces[sj], sv = flick(t, sc.ph*2.0 + 5.0)*decoLv*gutFac(sj); sc.mat.color.setRGB(1.0*sv*2.2*(1 + 0.9*visG), 0.05*sv*2.2*(1 + 0.9*visG), 0.02*sv*2.2*(1 + 0.9*visG)); sc.mesh.scale.y = (0.7 + 0.5*sv)*(1 + 0.35*visG); if(sc.light) sc.light.intensity = 2.4*sv*(1 + 0.8*visG); }

    /* ---- player ---- */
    if(introDone){
      var fwd = (keys.KeyW||keys.ArrowUp ? 1:0) - (keys.KeyS||keys.ArrowDown ? 1:0) - joy.y;
      var rgt = (keys.KeyD||keys.ArrowRight ? 1:0) - (keys.KeyA||keys.ArrowLeft ? 1:0) + joy.x;
      var ml = Math.sqrt(fwd*fwd + rgt*rgt); if(ml > 1){ fwd /= ml; rgt /= ml; }
      var sy = Math.sin(yaw), cy = Math.cos(yaw);
      var tvx = (-sy*fwd + cy*rgt)*SPEED, tvz = (-cy*fwd - sy*rgt)*SPEED;
      var k = Math.min(1, dt*9);
      player.vx += (tvx - player.vx)*k; player.vz += (tvz - player.vz)*k;
      var ox = player.x, oz = player.z;
      player.x += player.vx*dt; player.z += player.vz*dt;
      collide();
      movedDist += Math.sqrt((player.x-ox)*(player.x-ox) + (player.z-oz)*(player.z-oz));
    }
    var introPush = reduce ? 1 : ease(t/T_SPAWN);
    camera.position.set(player.x, EYE, player.z + (introDone ? 0 : 1.8*(1 - introPush)));
    camera.rotation.set(pitch, yaw, 0);
    var shk = 0, kk = 0;
    for(var sk=0; sk<NW; sk++){
      var sw2 = waves[sk];
      if(sw2.str > 0.4 && sw2.t < 2.5) shk = Math.max(shk, sw2.str*Math.exp(-sw2.t*3.0));
      if(sw2.str > 0.3 && sw2.t < 1.5) kk = Math.max(kk, sw2.str*Math.min(1, sw2.t/0.05)*Math.exp(-sw2.t*4.5));
    }
    var smag = shk*0.09 + charge*charge*0.003;
    if(smag > 0.0001){
      camera.position.x += (Math.random()-0.5)*smag; camera.position.y += (Math.random()-0.5)*smag;
      camera.rotation.z = (Math.random()-0.5)*(shk*0.02 + charge*charge*0.0008);
    }
    var fvv = baseFov + 11*kk;
    if(Math.abs(fvv - lastFov) > 0.01){ camera.fov = fvv; camera.updateProjectionMatrix(); lastFov = fvv; }

    /* ---- the artifact notices you ---- */
    tmp.set(player.x - art.position.x, EYE - art.position.y, player.z - art.position.z);
    var dist = tmp.length(); tmp.normalize();
    var prox = sstep(11, 5, dist);
    magT.copy(tmp);
    U.uMag.value.lerp(magT, Math.min(1, dt*5)).normalize();

    var tease = 0;
    if(introDone && !fired && !used){
      if(teaseT < 0 && t > unlockAt + 6 && t > nextTease) teaseT = 0;
      if(teaseT >= 0){
        teaseT += dt;
        var sw = teaseBig ? 2.8 : 1.3;
        tease = sstep(0, sw, teaseT)*(1 - sstep(sw + 0.2, sw + 0.4, teaseT));
        if(!teaseFired && teaseT >= sw + 0.3){
          teaseFired = true;
          fireRipple(U.uMag.value, teaseBig ? 0.5 : 0.14); flash = teaseBig ? 1.1 : 0.35;
          fireRoom(15, teaseBig ? 0.95 : 0.3, teaseBig ? 0.9 : 0.3, 1, teaseBig ? 0.55 : 0.12, false);
        }
        if(teaseT > sw + 1.0){ teaseT = -1; teaseFired = false; teaseBig = !teaseBig; nextTease = t + 5; }
      }
    } else { teaseT = -1; }

    var down = introDone && (src.mouse || src.key || src.btn || pendPress); pendPress = false;
    if(down) charge = Math.min(1, charge + dt/1.6); else charge = Math.max(0, charge - dt*2.4);
    if(wasDown && !down){
      fireRipple(U.uMag.value, 0.1 + 0.42*charge); flash = Math.min(2.4, flash*0.6 + 0.35 + charge);
      var tier = charge < 0.4 ? 1 : (charge < 0.92 ? 2 : 3);
      crack = Math.max(crack, 0.55 + 0.45*charge);
      if(tier === 3) flash = Math.min(3.2, flash + 1.2);
      fireRoom(tier === 3 ? 19 : (tier === 2 ? 15 : 13), tier === 3 ? 1.0 : (tier === 2 ? 0.75 : 0.4), charge, 1, tier === 3 ? 1.0 : (tier === 2 ? 0.65 : 0.2), tier === 3);
      used = true; fired = true;
    }
    if(down) used = true;
    wasDown = down;

    var tp = prox*0.45 + (down ? 0.5*charge : 0) + tease*0.3;
    pull += (tp - pull)*Math.min(1, dt*5);
    for(var ri=0; ri<NR; ri++){ var rr = rip[ri]; rr.t += dt; if(rr.t > 7) rr.a = 0; U.uWaveT.value[ri] = rr.t; U.uWaveAmp.value[ri] = rr.a; }
    flash *= Math.exp(-dt*2.6);

    tArt += dt*(1 + prox*1.2 + charge*1.5);
    U.uTime.value = tArt*(reduce ? 0.3 : 1);
    var vis = Math.max(charge, tease*(teaseBig ? 0.95 : 0.38)); visG = vis;
    U.uPull.value = pull; U.uCharge.value = vis;
    if(vis > crack) crack += (vis - crack)*Math.min(1, dt*5); else crack = Math.max(vis, crack - dt*0.55);
    U.uCrack.value = crack;
    art.position.y = ART_Y + 0.08*Math.sin(t*0.6);

    /* ---- room wave: wireframe reveal ---- */
    var wBusy = false, burst = 0;
    gutT += dt*((gutOn && gutT < 0.1) ? 0.3 : 1);
    if(gutOn && gutT > 5) gutOn = false;
    for(var wi=0; wi<NW; wi++){
      var w = waves[wi];
      w.t += dt*((w.gut && w.t < 0.1) ? 0.3 : 1);
      if(w.t > 10) w.str = 0;
      var R = w.t*w.spd;
      WU.uWR.value[wi] = R;
      WU.uWA.value[wi] = w.amp*(1 - sstep(30, 54, R));
      WU.uWT.value[wi] = 8 + 8*w.amp;
      WU.uWH.value[wi] = w.hot; WU.uWM.value[wi] = w.mode; WU.uWS.value[wi] = w.spd;
      WU.uWK.value[wi] = Math.max(0, (w.str - 0.2)/0.8)*(1 - sstep(3.5, 7.0, w.t));
      if(w.t < 6) wBusy = true;
      if(w.str > 0.15 && w.t < 10) burst += w.str*(1 - Math.exp(-w.t*7.0))*Math.exp(-w.t*0.45);
    }
    WU.uWaveC.value.set(art.position.x, art.position.y, art.position.z);

    /* ---- the sun: sickly, throbbing, and (rarely) it dies for a moment; blood red when charged ---- */
    artLight.color.setRGB(0.32 + 0.68*vis, 0.9 - 0.84*vis, 0.6 - 0.57*vis);
    var beat = Math.pow(Math.max(0, Math.sin(tArt*1.5)), 10)*0.5 + Math.pow(Math.max(0, Math.sin(tArt*1.5 - 0.75)), 10)*0.3;
    artLight.intensity = (1.9 + 0.6*Math.sin(tArt*0.7) + 1.7*vis + 1.0*crack + 2.4*flash)*(1 + 0.5*beat)*stMult*artLv;
    artLight.position.set(0.35*Math.sin(tArt*0.45), art.position.y + 0.15*Math.sin(tArt*0.9), 0.35*Math.cos(tArt*0.38));

    dmat.uniforms.uTime.value = t; dmat.uniforms.uC.value.copy(art.position); dmat.uniforms.uLevel.value = artLv*(0.3 + 0.7*stMult);
    dmat.uniforms.uAttr.value = Math.min(1, vis*1.1);
    dmat.uniforms.uBurst.value = Math.min(1.4, burst);

    /* ---- hints and touch UI: charging works from anywhere in the room ---- */
    var msg = '';
    if(introDone && !fired){
      var since = t - unlockAt;
      if(down) msg = touchMode ? 'Let go to send the light' : 'Release to send the light';
      else if(!used && movedDist < 3 && since > 0.6 && since < 12) msg = touchMode ? 'Left thumb walks, drag the right side to look' : 'Click to look around, WASD to walk';
      else if(since < 90) msg = touchMode ? 'Hold the ring, let go to send the light' : 'Hold space, release to send the light';
    }
    /* ---- wordless cues: key glyphs on desktop, ghost gestures on touch; each fades once you've done the thing ---- */
    var cueOn = introDone && (t - unlockAt) > 0.8;
    lookAcc += Math.abs(yaw - lastYaw) + Math.abs(pitch - lastPitch); lastYaw = yaw; lastPitch = pitch;
    if(lookAcc > 0.5) didLook = true;
    if(movedDist > 4) didMove = true;
    gLookEl.classList.toggle('on', cueOn && !touchMode && (!didLook || !fired));
    gMoveEl.classList.toggle('on', cueOn && !touchMode && !didMove);
    
    gJoyEl.classList.toggle('on', cueOn && touchMode && !didMove);
    gLkEl.classList.toggle('on', cueOn && touchMode && !didLook);
    kW.classList.toggle('dn', !!(keys.KeyW || keys.ArrowUp));
    kA.classList.toggle('dn', !!(keys.KeyA || keys.ArrowLeft));
    kS.classList.toggle('dn', !!(keys.KeyS || keys.ArrowDown));
    kD.classList.toggle('dn', !!(keys.KeyD || keys.ArrowRight));
    mBtn.classList.toggle('dn', !!src.mouse);
    setHint('');
    ringEl.classList.toggle('on', touchMode && introDone);
    ringEl.classList.toggle('cue', !used);

    /* ---- reflections: capture the hall from the artifact's centre ---- */
    frameN++;
    if(cubeCam && spawned && frameN > 4){
      var busyR = (flash > 0.05 || charge > 0.02 || wBusy || tease > 0.01);
      var every = (MOBILE ? 6 : (busyR ? 2 : 4)) + 2*cubeSlow;
      if(frameN % every === 0){
        art.visible = false;
        var sau = renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate = false;
        cubeCam.position.copy(art.position);
        cubeCam.update(renderer, scene);
        renderer.shadowMap.autoUpdate = sau;
        art.visible = true;
      }
    }

    /* ---- adaptive quality ---- */
    if(t > 3){
      fpsAcc += dt; fpsN++;
      if(fpsAcc > 2.5){
        var ms = fpsAcc/fpsN*1000;
        if(ms > 24 && adapt < 3){
          adapt++; cubeSlow = adapt; qW = Math.max(360, qW*0.8); applyRes();
          if(adapt >= 2 && bloom) bloom.enabled = false;
        }
        fpsAcc = 0; fpsN = 0;
      }
    }

    if(useComposer){
      bloom.strength = BLOOM_BASE + flash*1.2 + charge*0.4;
      finalPass.uniforms.uTime.value = t % 100;
      finalPass.uniforms.uCharge.value = charge;
      composer.render(dt);
    } else renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
